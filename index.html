<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>LGBM Atlas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LGBM Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'IBM Plex Sans';src:url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Archivo';src:url('fonts/archivo-latin-800-normal.woff2') format('woff2');font-weight:800}
:root{--bg:#f3f5f8;--surface:#fff;--ink:#121821;--ink-2:#434d5b;--muted:#6c7787;--rule:#dbe0e7;--fc:#2a78d6;--crit:#b8322a;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1115;--surface:#151a20;--ink:#e7ebf0;--ink-2:#b2bac6;--muted:#8992a1;--rule:#262c35;--fc:#3987e5;--crit:#f07a70;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'IBM Plex Sans',system-ui,-apple-system,sans-serif;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
form{width:min(100%,380px);background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px 20px;display:grid;gap:14px}
.eyebrow{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:800 28px/1.05 'Archivo','Arial Narrow',sans-serif;letter-spacing:-.01em}
p{margin:0;color:var(--ink-2);font-size:14px}
label{font-size:13px;color:var(--ink-2);display:grid;gap:6px}
input[type=password],input[type=text]{font:500 17px/1.2 'IBM Plex Mono',monospace;padding:12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--fc);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.row input{width:20px;height:20px;accent-color:var(--fc)}
button{font:600 16px/1 'IBM Plex Sans',sans-serif;background:var(--fc);color:#fff;border:0;border-radius:8px;min-height:46px;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--crit);font-size:13.5px}
.busy{font:500 13px 'IBM Plex Mono',monospace;color:var(--muted)}
</style>
</head>
<body>
<form id="lock" autocomplete="on" hidden>
  <div class="eyebrow">Private · encrypted</div>
  <h1>LGBM Atlas</h1>
  <p>Enter the passphrase to open. Unlocking happens on this device, so it also works offline.</p>
  <input type="text" name="username" value="lgbm-atlas" autocomplete="username" hidden>
  <label for="pass">Passphrase
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  </label>
  <label class="row" for="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Unlock</button>
  <div id="err" class="err" role="alert" hidden>That passphrase didn't open it. Check the spelling and the hyphens between the words.</div>
</form>

const KEY_STORE = 'lgbm-atlas-key-v' + ENC.v;
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
async function openWith(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(ENC.iv)}, key, b64d(ENC.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pass){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
function showLock(){ document.getElementById('busy').hidden = true; document.getElementById('lock').hidden = false; document.getElementById('pass').focus(); }
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY_STORE); } catch(e) {}
  if (saved) {
    try { const k = await crypto.subtle.importKey('raw', b64d(saved), 'AES-GCM', false, ['decrypt']); await openWith(k); return; }
    catch(e) { try { localStorage.removeItem(KEY_STORE); } catch(_) {} }
  }
  showLock();
})();
document.getElementById('lock').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.hidden = true;
  try {
    const key = await derive(document.getElementById('pass').value.trim().toLowerCase());
    const raw = await crypto.subtle.exportKey('raw', key);
    const dk = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(ENC.iv)}, dk, b64d(ENC.ct));
    if (document.getElementById('remember').checked) { try { localStorage.setItem(KEY_STORE, b64e(raw)); } catch(e) {} }
    await openWith(dk);
  } catch(e) {
    err.hidden = false; btn.disabled = false; btn.textContent = 'Unlock';
  }
});
</script>
